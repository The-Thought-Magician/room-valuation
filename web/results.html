<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room valuation: results</title>
<style>
  :root { --fg:#16181d; --muted:#667085; --line:#e4e7ec; --accent:#1d4ed8; --bg:#f8fafc; --warn:#b54708; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:var(--fg); background:var(--bg); }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; margin:8px 0; }
  h2 { font-size:16px; margin:22px 0 8px; }
  .muted { color:var(--muted); }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:10px; }
  .tile { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; }
  .tile .v { font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; }
  .tile .k { font-size:13px; color:var(--muted); }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.02em; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .chip { display:inline-block; font-size:11px; padding:1px 7px; border-radius:99px; border:1px solid var(--line); margin:0 3px 3px 0; color:var(--muted); }
  .chip.win { border-color:var(--accent); color:var(--accent); }
  .flag { color:var(--warn); font-size:12px; }
  tr.item { cursor:pointer; }
  tr.detail td { background:#fafbfc; }
  tr.detail img { height:72px; border-radius:6px; margin:4px 4px 0 0; border:1px solid var(--line); }
  .stages li { margin:3px 0; }
  .stages .done { color:#067647; } .stages .failed { color:#b42318; } .stages .running { color:var(--accent); }
  a { color:var(--accent); }
  img.plan { max-width:100%; border-radius:8px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Valuation</h1>
  <div id="progress" class="card"><ul class="stages" id="stages"><li>queued</li></ul></div>
  <div id="report" hidden>
    <div class="tiles" id="tiles"></div>
    <h2>Items</h2>
    <p class="muted">Tap a row for what each source said. Chips show the sources that saw the item; the highlighted one is the source Jev trusted. RCV is replacement cost new, ACV is after depreciation.</p>
    <div class="card"><table id="items"></table></div>
    <h2>How the sources ranked (Jev)</h2>
    <div class="card"><table id="board"></table></div>
    <h2>By category</h2>
    <div class="card"><table id="cats"></table></div>
    <div id="books"></div>
    <h2>Floor area</h2>
    <div class="card" id="area"></div>
    <h2>Notes</h2>
    <div class="card" id="notes"></div>
    <p><a id="json" href="#">Download report.json</a></p>
  </div>
</main>
<script>
const cid = location.pathname.split("/").pop();
const api = `/api/captures/${cid}`;
const inr = v => v == null ? "–" : "₹" + Math.round(v).toLocaleString("en-IN");
const pct = v => v == null ? "" : ` ${(100 * v).toFixed(0)}%`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ORDER = ["prepare", "frontier", "local", "voice", "area", "jev", "report"];
const NAMES = { prepare: "photos prepared", frontier: "pipeline 2: frontier model", local: "pipeline 1: local models",
  voice: "voice narration", area: "floor area", jev: "Jev: match and rank", report: "report" };

async function poll() {
  const s = await (await fetch(api + "/status")).json();
  const ul = document.getElementById("stages");
  if (s.failed) { ul.innerHTML = `<li class="failed">failed: ${esc(s.failed)}</li>`; return; }
  if (s.queued) { setTimeout(poll, 2000); return; }
  ul.innerHTML = ORDER.filter(k => s.stages[k]).map(k => {
    const st = s.stages[k];
    const extra = st.items != null ? ` (${st.items} items${st.seconds ? ", " + st.seconds + " s" : ""})` : st.error ? `: ${esc(st.error)}` : st.source ? `: ${esc(st.source)}` : "";
    return `<li class="${st.state}">${NAMES[k]}: ${st.state}${extra}</li>`;
  }).join("");
  if (s.stages.report && s.stages.report.state === "done") { show(); return; }
  setTimeout(poll, 2000);
}

async function show() {
  const r = await (await fetch(api + "/report")).json();
  document.getElementById("title").textContent = `${r.room}, ${r.city}: insured value`;
  document.getElementById("report").hidden = false;
  const t = r.totals, a = r.area || {};
  const shelves = Object.entries(r.shelves || {}).map(([k, v]) => `${v} (${k})`).join(", ") || "–";
  document.getElementById("tiles").innerHTML = [
    ["Contents RCV", inr(t.contents.rcv_inr)], ["Contents ACV", inr(t.contents.acv_inr)],
    ["Building fixtures RCV", inr(t.building_fixtures.rcv_inr)], ["Total RCV", inr(t.rcv_inr)],
    ["Items", t.items + (t.unpriced ? ` (${t.unpriced} unpriced)` : "")], ["Needs review", t.needs_review],
    ["Possible double count", inr(t.possible_double_count_inr)],
    ["Floor area", a.area_m2 ? `${a.area_sqft} sq ft` : "–"], ["Books", `${t.books.count} (${inr(t.books.rcv_inr)})`],
    ["Shelves", shelves], ["Pipeline 2", r.backend],
  ].map(([k, v]) => `<div class="tile"><div class="v">${esc(v)}</div><div class="k">${k}</div></div>`).join("");

  const rows = [`<tr><th>Item</th><th>Seen by</th><th>Condition</th><th class="num">RCV</th><th class="num">ACV</th><th>Price from</th></tr>`];
  for (const it of [...r.items].sort((x, y) => (y.rcv_inr || 0) - (x.rcv_inr || 0))) {
    const title = it.book ? `${esc(it.book.title)}<div class="muted">${esc(it.book.author || "")} · ${esc(it.book.genre || "")}</div>`
      : `${esc([it.brand, it.model].filter(Boolean).join(" ") || "")} ${esc(it.name)}<div class="muted">${esc(it.category)}${it.quantity > 1 ? " × " + it.quantity : ""}</div>`;
    const chips = it.sources.map(s => `<span class="chip ${s === it.identity_from ? "win" : ""}">${s}${s === it.identity_from && it.identity_confidence != null ? pct(it.identity_confidence) : ""}</span>`).join("");
    const src = it.price_source && it.price_source.startsWith("http") ? `<a href="${esc(it.price_source)}" target="_blank" rel="noopener">${esc(it.price_from)}</a>` : esc(it.price_from || "–");
    const flags = it.flags.length ? `<div class="flag">${it.flags.map(esc).join("<br>")}</div>` : "";
    rows.push(`<tr class="item" data-n="${it.n}"><td>${title}${flags}</td><td>${chips}</td><td>${esc(it.condition || "–")}</td><td class="num">${inr(it.rcv_inr)}</td><td class="num">${inr(it.acv_inr)}</td><td>${src}${it.price_confidence != null ? `<div class="muted">Jev${pct(it.price_confidence)}</div>` : ""}</td></tr>`);
    const cands = Object.entries(it.candidates).map(([s, c]) => `<div><b>${s}</b>: ${esc([c.brand, c.model, c.name].filter(Boolean).join(" "))}, ${inr(c.rcv_inr)} <span class="muted">${esc(c.price_note || "")}</span> ${c.price_source && c.price_source.startsWith("http") ? `<a href="${esc(c.price_source)}" target="_blank" rel="noopener">source</a>` : esc(c.price_source || "")}</div>`).join("");
    const probs = ["identity", "price"].map(k => Object.keys(it[k + "_probs"]).length ? `<div class="muted">Jev ${k}: ${Object.entries(it[k + "_probs"]).map(([s, p]) => `${s} ${(100 * p).toFixed(0)}%`).join(", ")}</div>` : "").join("");
    const imgs = it.photos.map(p => `<img src="${api}/photo/${encodeURIComponent(p)}" loading="lazy">`).join("");
    rows.push(`<tr class="detail" id="d${it.n}" hidden><td colspan="6">${cands}${probs}<div class="muted">${esc(it.acv_basis || "")}${it.price_paid_inr ? ` · owner paid ${inr(it.price_paid_inr)}${it.age_years != null ? ", " + it.age_years + " y ago" : ""}` : ""}</div>${imgs}</td></tr>`);
  }
  const tbl = document.getElementById("items");
  tbl.innerHTML = rows.join("");
  tbl.querySelectorAll("tr.item").forEach(tr => tr.onclick = () => { const d = document.getElementById("d" + tr.dataset.n); d.hidden = !d.hidden; });

  const b = r.leaderboard;
  document.getElementById("board").innerHTML = `<tr><th>Source</th><th class="num">Items found</th><th class="num">Found alone</th><th class="num">Identity chosen</th><th class="num">Price chosen</th><th class="num">Mean Jev prob. (price)</th></tr>` +
    Object.entries(b).map(([s, v]) => `<tr><td>${s}</td><td class="num">${v.items_found}</td><td class="num">${v.found_alone}</td><td class="num">${v.identity.chosen}/${v.identity.contested}</td><td class="num">${v.price.chosen}/${v.price.contested}</td><td class="num">${v.price.mean_probability ?? "–"}</td></tr>`).join("");
  document.getElementById("cats").innerHTML = `<tr><th>Category</th><th class="num">Items</th><th class="num">RCV</th><th class="num">ACV</th></tr>` +
    Object.entries(t.by_category).map(([c, v]) => `<tr><td>${c}</td><td class="num">${v.items}</td><td class="num">${inr(v.rcv_inr)}</td><td class="num">${inr(v.acv_inr)}</td></tr>`).join("");
  if (t.books.count) document.getElementById("books").innerHTML = `<h2>Books by genre</h2><div class="card">${Object.entries(t.books.by_genre).map(([g, n]) => `<span class="chip">${esc(g)}: ${n}</span>`).join("")}</div>`;
  document.getElementById("area").innerHTML = (a.area_m2 ? `<p><b>${a.area_m2} m² (${a.area_sqft} sq ft)</b>, from ${esc(a.source)}${a.interval_m2 ? `, interval ${a.interval_m2.join(" to ")} m²` : ""}</p>` : "<p>No floor area.</p>") +
    (a.candidates || []).slice(1).map(c => `<div class="muted">also: ${c.area_m2} m² from ${esc(c.source)}</div>`).join("") +
    (a.plan_png ? `<img class="plan" src="${api}/plan.png">` : "");
  const notes = Object.entries(r.sources).flatMap(([s, v]) => v.notes.map(n => `<li><b>${s}</b>: ${esc(n)}</li>`));
  const errs = Object.entries(r.errors).map(([s, e]) => `<li class="flag"><b>${s}</b> failed: ${esc(e)}</li>`);
  document.getElementById("notes").innerHTML = `<ul>${[...errs, ...notes].join("")}</ul><div class="muted">Jev scored ${r.jev_pairs_scored} candidate pairs; the similarity filter skipped ${r.jev_pairs_skipped ?? 0}. Total run ${r.seconds} s.</div>`;
  document.getElementById("json").href = api + "/report";
}
poll();
</script>
</body>
</html>
